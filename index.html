<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina Maker · Editor Arduino</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root{--bg:#f3f6f4;--pn:#fff;--tx:#17302b;--mu:#5d746e;--ln:#cfdad6;--ac:#0b7a6b;--ac2:#fff;--ed:#fbfdfc;--er:#b3261e;--ok:#16794a}
@media(prefers-color-scheme:dark){:root:not([data-t=l]){--bg:#0f1d1a;--pn:#16292520;--tx:#e3f0ec;--mu:#8fa8a1;--ln:#2a423d;--ac:#3fd0b8;--ac2:#06231e;--ed:#0b1614;--er:#ff8a80;--ok:#6ee7a8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Nunito","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--ln)}
h1{font-size:1.25rem;margin:0 auto 0 0;font-weight:800}
button,select{font:inherit;min-height:44px;border-radius:12px;border:2px solid var(--ln);background:var(--pn);color:var(--tx);padding:0 14px}
button{font-weight:800;cursor:pointer}
button.main{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#st{padding:6px 14px;color:var(--mu);font-size:.9rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:10px;padding:0 14px 14px}
.ed{display:flex;min-height:0;border:2px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--ed)}
#nums{padding:12px 8px;text-align:right;color:var(--mu);font:14px/1.5 ui-monospace,Consolas,monospace;overflow:hidden;user-select:none;border-right:2px solid var(--ln)}
#code{flex:1;border:0;resize:none;outline:0;padding:12px;background:transparent;color:var(--tx);font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre;tab-size:2}
#out{border:2px solid var(--ln);border-radius:14px;padding:10px 12px;overflow:auto;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--pn);min-height:0}
#out div{white-space:pre-wrap;word-break:break-word}.err{color:var(--er)}.ok{color:var(--ok)}
progress{width:100%;height:10px;accent-color:var(--ac)}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 180px}}
</style>
</head>
<body>
<header>
  <h1>🤖 Oficina Maker</h1>
  <select id="board" aria-label="Placa">
    <option value="arduino:avr:mega">Arduino Mega 2560</option>
    <option value="arduino:avr:uno">Arduino Uno (só verificar)</option>
  </select>
  <button id="bCon">Conectar USB</button>
  <button id="bVer">Verificar</button>
  <button id="bUp" class="main">Enviar para a placa</button>
  <button id="bDl" title="Baixar o código">Baixar .ino</button>
</header>
<div id="st">Placa: não conectada</div>
<main>
  <div class="ed"><div id="nums">1</div><textarea id="code" spellcheck="false" aria-label="Código"></textarea></div>
  <div><progress id="pg" value="0" max="100" hidden></progress><div id="out" role="log" style="height:calc(100% - 4px)"></div></div>
</main>
<script type="text/plain" id="ex">#include <AFMotor.h>
#include <Servo.h>

// Carrinho fura-balão: 4 motores + servo da lança
AF_DCMotor motor1(1);
AF_DCMotor motor2(2);
AF_DCMotor motor3(3);
AF_DCMotor motor4(4);

Servo servoLanca;

char comandoAtual = 'S';
char ultimoComando = ' ';
int anguloAtual = 90;

void setup() {
  Serial.begin(115200);
  Serial1.begin(9600);

  servoLanca.attach(10);
  servoLanca.write(anguloAtual);

  parar();
}

void loop() {
  if (Serial1.available() > 0) {
    comandoAtual = Serial1.read();
    processarComando(comandoAtual);
  }
}

void acelerarSuave(uint8_t d1, uint8_t d2, uint8_t d3, uint8_t d4) {
  motor1.run(d1);
  motor2.run(d2);
  motor3.run(d3);
  motor4.run(d4);

  for (int speed = 40; speed <= 255; speed += 35) {
    motor1.setSpeed(speed);
    motor2.setSpeed(speed);
    motor3.setSpeed(speed);
    motor4.setSpeed(speed);
    delay(15);
  }
}

void frente() { acelerarSuave(FORWARD, FORWARD, FORWARD, FORWARD); }
void tras() { acelerarSuave(BACKWARD, BACKWARD, BACKWARD, BACKWARD); }
void direita() { acelerarSuave(FORWARD, BACKWARD, BACKWARD, FORWARD); }
void esquerda() { acelerarSuave(BACKWARD, FORWARD, FORWARD, BACKWARD); }

void parar() {
  motor1.run(RELEASE);
  motor2.run(RELEASE);
  motor3.run(RELEASE);
  motor4.run(RELEASE);
}

void processarComando(char cmd) {
  if (cmd != ultimoComando) {
    switch (cmd) {
      case 'F': frente(); break;
      case 'B': tras(); break;
      case 'L': direita(); break;
      case 'R': esquerda(); break;
      case 'S': parar(); break;
    }
    ultimoComando = cmd;
  }
}
</script>
<script>
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const log = (m, c = '') => { $('out').insertAdjacentHTML('beforeend', `<div class="${c}">${esc(m)}</div>`); $('out').scrollTop = 1e9; };
let port = null, busy = false;
const KNOWN = { '2341:0042': 'Arduino Mega 2560', '2341:0010': 'Arduino Mega 2560', '2341:0043': 'Arduino Uno', '1a86:7523': 'placa com chip CH340 (clone)', '0403:6001': 'placa com chip FTDI' };

// Editor
const code = $('code');
const nums = () => { $('nums').textContent = Array.from({ length: code.value.split('\n').length }, (_, i) => i + 1).join('\n'); };
try { code.value = localStorage.getItem('om-code') || ''; } catch {}
if (!code.value) code.value = $('ex').textContent.trimStart();
nums();
code.addEventListener('input', () => { nums(); try { localStorage.setItem('om-code', code.value); } catch {} });
code.addEventListener('scroll', () => { $('nums').scrollTop = code.scrollTop; });
code.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); } });
$('bDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code.value])); a.download = 'sketch.ino'; a.click(); };

// Compilação (no servidor)
async function compile() {
  log('Compilando… (a primeira vez pode demorar)');
  const h = { 'Content-Type': 'application/json', 'x-pin': sessionStorage.getItem('om-pin') || '' };
  let r = await fetch('/api/compile', { method: 'POST', headers: h, body: JSON.stringify({ code: code.value, fqbn: $('board').value }) });
  if (r.status === 401) {
    const p = prompt('Digite o PIN da oficina:'); sessionStorage.setItem('om-pin', p || ''); h['x-pin'] = p || '';
    r = await fetch('/api/compile', { method: 'POST', headers: h, body: JSON.stringify({ code: code.value, fqbn: $('board').value }) });
  }
  const j = await r.json();
  if (!j.ok) { log(j.log, 'err'); throw new Error('Há erros no código. Leia as mensagens acima.'); }
  log('Código verificado com sucesso ✔', 'ok');
  return j.hex;
}

// Conexão USB (Web Serial)
async function connect() {
  if (!('serial' in navigator)) throw new Error('Este navegador não tem Web Serial. Use o Chrome.');
  port = await navigator.serial.requestPort();
  const i = port.getInfo(), k = i.usbVendorId?.toString(16).padStart(4, '0') + ':' + i.usbProductId?.toString(16).padStart(4, '0');
  $('st').textContent = 'Placa conectada: ' + (KNOWN[k] || 'dispositivo USB (' + k + ')');
  log('USB conectada: ' + (KNOWN[k] || k));
}

// Leitor do arquivo .hex (Intel HEX)
function parseHex(t) {
  const m = new Uint8Array(262144).fill(255); let base = 0, max = 0;
  for (const l of t.split(/\r?\n/)) {
    if (l[0] !== ':') continue;
    const n = parseInt(l.substr(1, 2), 16), a = parseInt(l.substr(3, 4), 16), ty = parseInt(l.substr(7, 2), 16);
    if (ty === 0) { for (let i = 0; i < n; i++) m[base + a + i] = parseInt(l.substr(9 + i * 2, 2), 16); max = Math.max(max, base + a + n); }
    else if (ty === 4) base = parseInt(l.substr(9, 4), 16) << 16;
    else if (ty === 2) base = parseInt(l.substr(9, 4), 16) << 4;
  }
  return m.subarray(0, max);
}

// Protocolo STK500v2 (bootloader do Mega 2560)
class Link {
  constructor(p) { this.q = []; this.seq = 0; this.r = p.readable.getReader(); this.w = p.writable.getWriter(); this.loop(); }
  async loop() { try { for (;;) { const { value, done } = await this.r.read(); if (done) break; this.q.push(...value); } } catch {} }
  async byte(ms) { const t = Date.now(); while (!this.q.length) { if (Date.now() - t > ms) throw new Error('timeout'); await sleep(2); } return this.q.shift(); }
  async cmd(body, ms = 1500) {
    const s = this.seq = (this.seq + 1) & 255, n = body.length, f = [0x1b, s, n >> 8, n & 255, 0x0e, ...body];
    f.push(f.reduce((a, b) => a ^ b));
    await this.w.write(new Uint8Array(f));
    for (;;) {
      if (await this.byte(ms) !== 0x1b) continue;
      const sq = await this.byte(ms), len = (await this.byte(ms)) << 8 | await this.byte(ms); await this.byte(ms);
      const b = []; for (let i = 0; i < len; i++) b.push(await this.byte(ms)); await this.byte(ms);
      if (sq === s) return b;
    }
  }
}

async function upload(hexText) {
  if (!port) await connect();
  const hex = parseHex(hexText); $('pg').hidden = false; $('pg').value = 0;
  await port.open({ baudRate: 115200 });
  const L = new Link(port);
  try {
    log('Reiniciando a placa…');
    await port.setSignals({ dataTerminalReady: false, requestToSend: false }); await sleep(250);
    await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    let ok = false;
    for (let i = 0; i < 25 && !ok; i++) { L.q.length = 0; try { ok = (await L.cmd([1], 300))[1] === 0; } catch {} }
    if (!ok) throw new Error('A placa não respondeu. Confira o cabo USB e se a placa é um Mega 2560.');
    try { await L.cmd([0x10, 200, 100, 25, 32, 0, 0x53, 3, 0xac, 0x53, 0, 0]); } catch {}
    log('Enviando o programa…');
    for (let a = 0; a < hex.length; a += 256) {
      const pg = new Uint8Array(256).fill(255); pg.set(hex.subarray(a, a + 256));
      const w = a >> 1;
      await L.cmd([6, 0x80, (w >> 16) & 255, (w >> 8) & 255, w & 255]);
      const r = await L.cmd([0x13, 1, 0, 0xc1, 0x0a, 0x40, 0x4c, 0x20, 0, 0, ...pg], 3000);
      if (r[1] !== 0) throw new Error('Falha ao gravar na posição ' + a);
      $('pg').value = Math.round(a / hex.length * 100);
    }
    log('Conferindo o que foi gravado…');
    for (let a = 0; a < hex.length; a += 256) {
      const w = a >> 1;
      await L.cmd([6, 0x80, (w >> 16) & 255, (w >> 8) & 255, w & 255]);
      const r = await L.cmd([0x14, 1, 0, 0x20], 3000);
      if (r[1] !== 0) throw new Error('A placa não permitiu ler a memória de volta.');
      const d = r.slice(2, 258), e = hex.subarray(a, a + 256);
      for (let i = 0; i < e.length; i++) if (d[i] !== e[i]) throw new Error('A gravação não ficou igual na posição ' + (a + i) + '. Tente enviar de novo.');
    }
    await L.cmd([0x11, 1, 1]);
    $('pg').value = 100; log('Programa enviado e conferido! A placa já está rodando. ✔', 'ok');
  } finally {
    try { await L.r.cancel(); } catch {}
    await sleep(60); try { L.r.releaseLock(); L.w.releaseLock(); await port.close(); } catch {}
    setTimeout(() => { $('pg').hidden = true; }, 2500);
  }
}

// Botões
async function run(fn) {
  if (busy) return; busy = true; document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { if (e.name !== 'NotFoundError') log(e.message, 'err'); }
  busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false);
}
$('bCon').onclick = () => run(connect);
$('bVer').onclick = () => run(compile);
$('bUp').onclick = () => run(async () => {
  if ($('board').value !== 'arduino:avr:mega') throw new Error('O envio funciona só para o Mega 2560 nesta versão. Use Verificar.');
  if (!port) await connect();
  await upload(await compile());
});
log('Bem-vinda(o)! 1) Conectar USB  2) Verificar  3) Enviar para a placa');
</script>
</body>
</html>
