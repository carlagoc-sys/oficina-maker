<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AD IDE for Chromebook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 28%22><rect x=%224%22 y=%222%22 width=%2234%22 height=%2224%22 rx=%224%22 fill=%22%230b7a6b%22/><rect y=%229%22 width=%2210%22 height=%2210%22 rx=%221%22 fill=%22%230b7a6b%22/><rect x=%2218%22 y=%229%22 width=%2212%22 height=%2210%22 rx=%221%22 fill=%22white%22/></svg>">
<style>
:root{--bg:#eef3f1;--pn:#fff;--tx:#17302b;--mu:#5d746e;--ln:#d3ddd9;--ac:#0b7a6b;--ac2:#fff;--ed:#fbfdfc;--gu:#f0f5f3;--er:#b3261e;--ok:#16794a;--c:#6b7f79;--s:#b45309;--k:#7c3aed;--f:#0b6bcb;--n:#c2410c;--p:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0c1715;--pn:#13231f;--tx:#e3f0ec;--mu:#8fa8a1;--ln:#26403a;--ac:#3fd0b8;--ac2:#06231e;--ed:#0a1412;--gu:#0e1b18;--er:#ff8a80;--ok:#6ee7a8;--c:#7f9a93;--s:#f5c07a;--k:#c4a7ff;--f:#7cc4ff;--n:#ff9e7a;--p:#6ee7c8}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Nunito","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo span{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ac);color:var(--ac2)}
.logo b{font-size:1.2rem;font-weight:800;line-height:1.1}.logo small{display:block;color:var(--mu);font-size:.75rem;font-weight:600}
button,select{font:inherit;font-weight:700;min-height:42px;border-radius:11px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:0 14px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.main{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
button.g{min-height:30px;font-size:.8rem;padding:0 10px;background:transparent}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#st{display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--mu);font-size:.88rem;font-weight:600}
#st::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mu);opacity:.5}
#st.on{color:var(--ok)}#st.on::before{background:var(--ok);opacity:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 360px;gap:12px;padding:0 16px 16px}
.ed{display:flex;min-height:0;min-width:0;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--ed)}
#nums,#hl,#code{font:14px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;margin:0;tab-size:2;white-space:pre}
#nums{flex:none;min-width:3.4em;padding:14px 12px 14px 0;text-align:right;color:var(--mu);background:var(--gu);border-right:1px solid var(--ln);overflow:hidden;user-select:none}
.cw{position:relative;flex:1;min-width:0}
#hl,#code{position:absolute;inset:0;width:100%;height:100%;padding:14px}
#hl{overflow:hidden;pointer-events:none;color:var(--tx)}
#code{border:0;resize:none;outline:0;background:transparent;color:transparent;caret-color:var(--tx);overflow:auto;border-radius:0}
#hl i{font-style:normal}#hl .c{color:var(--c);font-style:italic}#hl .s{color:var(--s)}#hl .k{color:var(--k);font-weight:700}#hl .f{color:var(--f)}#hl .n{color:var(--n)}#hl .p{color:var(--p)}
.con{display:flex;flex-direction:column;min-height:0;border:1px solid var(--ln);border-radius:14px;background:var(--pn);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--ln);font-weight:800}
progress{width:100%;height:6px;accent-color:var(--ac);display:block}progress[hidden]{display:none}
#out{flex:1;overflow:auto;padding:10px 12px;font:13px/1.5 ui-monospace,Consolas,monospace}
#out div{white-space:pre-wrap;word-break:break-word;padding:2px 0}.err{color:var(--er)}.ok{color:var(--ok);font-weight:700}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--pn);color:var(--tx);padding:0;width:min(520px,92vw);max-height:80vh}
dialog[open]{display:flex;flex-direction:column}dialog::backdrop{background:#0009}
#dq{margin:10px 12px;min-height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:0 10px;font:inherit}
#dl{overflow:auto}.lb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--ln);font-size:.9rem}
.lc{padding:10px 12px;border-top:1px solid var(--ln)}.lc b{display:block}.lc small{color:var(--mu)}.lc p{margin:4px 0 8px;font-size:.88rem}.lc button{min-height:36px}
#dp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 8px}.mu{color:var(--mu);font-size:.85rem}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:1fr 190px}}
</style>
</head>
<body>
<header>
  <div class="logo"><span><svg viewBox="0 0 40 28" width="32" height="22" fill="none" stroke="currentColor" aria-hidden="true"><rect x="4" y="2" width="34" height="24" rx="4" stroke-width="2"/><rect x="0" y="9" width="10" height="10" rx="1" fill="currentColor" stroke="none"/><rect x="18" y="9" width="12" height="10" rx="1" fill="currentColor" stroke="none"/><path d="M14 5.5H34M14 22.5H34" stroke-width="3" stroke-dasharray="2.2 1.8"/></svg></span><div><b>AD IDE</b><small>for Chromebook</small></div></div>
  <select id="board" aria-label="Placa">
    <option value="arduino:avr:mega">Arduino Mega 2560</option>
    <option value="arduino:avr:uno">Arduino Uno (só verificar)</option>
  </select>
  <button id="bCon">🔌 Conectar USB</button>
  <button id="bVer">✔ Verificar</button>
  <button id="bUp" class="main">⬆ Enviar para a placa</button>
  <button id="bLib">📚 Bibliotecas</button>
  <button id="bDl" title="Baixar o código">⬇ .ino</button>
</header>
<div id="st">Placa não conectada</div>
<main>
  <section class="ed"><div id="nums">1</div><div class="cw"><pre id="hl" aria-hidden="true"></pre><textarea id="code" wrap="off" spellcheck="false" aria-label="Código"></textarea></div></section>
  <aside class="con"><div class="ch"><span>Mensagens</span><button id="bClr" class="g">Limpar</button></div><progress id="pg" value="0" max="100" hidden></progress><div id="out" role="log"></div></aside>
</main>
<dialog id="dlg"><div class="ch"><span>📚 Bibliotecas</span><button id="dX" class="g">Fechar</button></div><input id="dq" placeholder="Buscar em todas as bibliotecas… (ex.: DHT, FastLED, LCD)" aria-label="Buscar biblioteca"><div id="dp"></div><div id="dl"></div></dialog>
<script type="text/plain" id="ex">#include <AFMotor.h>
#include <Servo.h>

// Carrinho fura-balão: 4 motores + servo da lança
AF_DCMotor motor1(1);
AF_DCMotor motor2(2);
AF_DCMotor motor3(3);
AF_DCMotor motor4(4);

Servo servoLanca;

char comandoAtual = 'S';
char ultimoComando = ' ';
int anguloAtual = 90;

void setup() {
  Serial.begin(115200);
  Serial1.begin(9600);

  servoLanca.attach(10);
  servoLanca.write(anguloAtual);

  parar();
}

void loop() {
  if (Serial1.available() > 0) {
    comandoAtual = Serial1.read();
    processarComando(comandoAtual);
  }
}

void acelerarSuave(uint8_t d1, uint8_t d2, uint8_t d3, uint8_t d4) {
  motor1.run(d1);
  motor2.run(d2);
  motor3.run(d3);
  motor4.run(d4);

  for (int speed = 40; speed <= 255; speed += 35) {
    motor1.setSpeed(speed);
    motor2.setSpeed(speed);
    motor3.setSpeed(speed);
    motor4.setSpeed(speed);
    delay(15);
  }
}

void frente() { acelerarSuave(FORWARD, FORWARD, FORWARD, FORWARD); }
void tras() { acelerarSuave(BACKWARD, BACKWARD, BACKWARD, BACKWARD); }
void direita() { acelerarSuave(FORWARD, BACKWARD, BACKWARD, FORWARD); }
void esquerda() { acelerarSuave(BACKWARD, FORWARD, FORWARD, BACKWARD); }

void parar() {
  motor1.run(RELEASE);
  motor2.run(RELEASE);
  motor3.run(RELEASE);
  motor4.run(RELEASE);
}

void processarComando(char cmd) {
  if (cmd != ultimoComando) {
    switch (cmd) {
      case 'F': frente(); break;
      case 'B': tras(); break;
      case 'L': direita(); break;
      case 'R': esquerda(); break;
      case 'S': parar(); break;
    }
    ultimoComando = cmd;
  }
}
</script>
<script>
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const log = (m, c = '') => { $('out').insertAdjacentHTML('beforeend', `<div class="${c}">${esc(m)}</div>`); $('out').scrollTop = 1e9; };
let port = null, busy = false;
const KNOWN = { '2341:0042': 'Arduino Mega 2560', '2341:0010': 'Arduino Mega 2560', '2341:0043': 'Arduino Uno', '1a86:7523': 'placa com chip CH340 (clone)', '0403:6001': 'placa com chip FTDI' };

// Editor
const code = $('code');
const KW = /^(if|else|for|while|do|switch|case|default|break|continue|return|void|int|char|long|short|byte|bool|boolean|float|double|unsigned|uint8_t|uint16_t|const|static|struct|class|true|false|HIGH|LOW|INPUT|OUTPUT|FORWARD|BACKWARD|RELEASE)$/;
function hl(t) {
  const e = t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return e.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(^[ \t]*#[^\n]*)|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)\b(\s*\()?/gm,
    (m, c, s, p, n, w, fn) => c ? `<i class="c">${m}</i>` : s ? `<i class="s">${m}</i>` : p ? `<i class="p">${m}</i>` : n ? `<i class="n">${m}</i>`
      : KW.test(w) ? `<i class="k">${w}</i>${fn || ''}` : fn ? `<i class="f">${w}</i>${fn}` : m);
}
const nums = () => {
  $('nums').textContent = Array.from({ length: code.value.split('\n').length }, (_, i) => i + 1).join('\n');
  $('hl').innerHTML = hl(code.value) + '\n';
};
try { code.value = localStorage.getItem('om-code') || ''; } catch {}
if (!code.value) code.value = $('ex').textContent.trimStart();
nums();
code.addEventListener('input', () => { nums(); try { localStorage.setItem('om-code', code.value); } catch {} });
code.addEventListener('scroll', () => { $('nums').scrollTop = code.scrollTop; $('hl').scrollTop = code.scrollTop; $('hl').scrollLeft = code.scrollLeft; });
code.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); } });
$('bDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code.value])); a.download = 'sketch.ino'; a.click(); };

// Compilação (no servidor)
async function compile() {
  log('Compilando… (bibliotecas novas podem levar alguns minutos na primeira vez)');
  const h = { 'Content-Type': 'application/json', 'x-pin': sessionStorage.getItem('om-pin') || '' };
  let r = await fetch('/api/compile', { method: 'POST', headers: h, body: JSON.stringify({ code: code.value, fqbn: $('board').value, libs: PL }) });
  if (r.status === 401) {
    const p = prompt('Digite o PIN da oficina:'); sessionStorage.setItem('om-pin', p || ''); h['x-pin'] = p || '';
    r = await fetch('/api/compile', { method: 'POST', headers: h, body: JSON.stringify({ code: code.value, fqbn: $('board').value, libs: PL }) });
  }
  const j = await r.json();
  if (!j.ok) { log(j.log, 'err'); throw new Error('Há erros no código. Leia as mensagens acima.'); }
  log('Código verificado com sucesso ✔', 'ok');
  return j.hex;
}

// Conexão USB (Web Serial)
async function connect() {
  if (!('serial' in navigator)) throw new Error('Este navegador não tem Web Serial. Use o Chrome.');
  port = await navigator.serial.requestPort();
  const i = port.getInfo(), k = i.usbVendorId?.toString(16).padStart(4, '0') + ':' + i.usbProductId?.toString(16).padStart(4, '0');
  $('st').textContent = 'Placa conectada: ' + (KNOWN[k] || 'dispositivo USB (' + k + ')'); $('st').className = 'on';
  log('USB conectada: ' + (KNOWN[k] || k));
}

// Leitor do arquivo .hex (Intel HEX)
function parseHex(t) {
  const m = new Uint8Array(262144).fill(255); let base = 0, max = 0;
  for (const l of t.split(/\r?\n/)) {
    if (l[0] !== ':') continue;
    const n = parseInt(l.substr(1, 2), 16), a = parseInt(l.substr(3, 4), 16), ty = parseInt(l.substr(7, 2), 16);
    if (ty === 0) { for (let i = 0; i < n; i++) m[base + a + i] = parseInt(l.substr(9 + i * 2, 2), 16); max = Math.max(max, base + a + n); }
    else if (ty === 4) base = parseInt(l.substr(9, 4), 16) << 16;
    else if (ty === 2) base = parseInt(l.substr(9, 4), 16) << 4;
  }
  return m.subarray(0, max);
}

// Protocolo STK500v2 (bootloader do Mega 2560)
class Link {
  constructor(p) { this.q = []; this.seq = 0; this.r = p.readable.getReader(); this.w = p.writable.getWriter(); this.loop(); }
  async loop() { try { for (;;) { const { value, done } = await this.r.read(); if (done) break; this.q.push(...value); } } catch {} }
  async byte(ms) { const t = Date.now(); while (!this.q.length) { if (Date.now() - t > ms) throw new Error('timeout'); await sleep(2); } return this.q.shift(); }
  async cmd(body, ms = 1500) {
    const s = this.seq = (this.seq + 1) & 255, n = body.length, f = [0x1b, s, n >> 8, n & 255, 0x0e, ...body];
    f.push(f.reduce((a, b) => a ^ b));
    await this.w.write(new Uint8Array(f));
    for (;;) {
      if (await this.byte(ms) !== 0x1b) continue;
      const sq = await this.byte(ms), len = (await this.byte(ms)) << 8 | await this.byte(ms); await this.byte(ms);
      const b = []; for (let i = 0; i < len; i++) b.push(await this.byte(ms)); await this.byte(ms);
      if (sq === s) return b;
    }
  }
}

async function upload(hexText) {
  if (!port) await connect();
  const hex = parseHex(hexText); $('pg').hidden = false; $('pg').value = 0;
  await port.open({ baudRate: 115200 });
  const L = new Link(port);
  try {
    log('Reiniciando a placa…');
    await port.setSignals({ dataTerminalReady: false, requestToSend: false }); await sleep(250);
    await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    let ok = false;
    for (let i = 0; i < 25 && !ok; i++) { L.q.length = 0; try { ok = (await L.cmd([1], 300))[1] === 0; } catch {} }
    if (!ok) throw new Error('A placa não respondeu. Confira o cabo USB e se a placa é um Mega 2560.');
    try { await L.cmd([0x10, 200, 100, 25, 32, 0, 0x53, 3, 0xac, 0x53, 0, 0]); } catch {}
    log('Enviando o programa…');
    for (let a = 0; a < hex.length; a += 256) {
      const pg = new Uint8Array(256).fill(255); pg.set(hex.subarray(a, a + 256));
      const w = a >> 1;
      await L.cmd([6, 0x80, (w >> 16) & 255, (w >> 8) & 255, w & 255]);
      const r = await L.cmd([0x13, 1, 0, 0xc1, 0x0a, 0x40, 0x4c, 0x20, 0, 0, ...pg], 3000);
      if (r[1] !== 0) throw new Error('Falha ao gravar na posição ' + a);
      $('pg').value = Math.round(a / hex.length * 100);
    }
    log('Conferindo o que foi gravado…');
    for (let a = 0; a < hex.length; a += 256) {
      const w = a >> 1;
      await L.cmd([6, 0x80, (w >> 16) & 255, (w >> 8) & 255, w & 255]);
      const r = await L.cmd([0x14, 1, 0, 0x20], 3000);
      if (r[1] !== 0) throw new Error('A placa não permitiu ler a memória de volta.');
      const d = r.slice(2, 258), e = hex.subarray(a, a + 256);
      for (let i = 0; i < e.length; i++) if (d[i] !== e[i]) throw new Error('A gravação não ficou igual na posição ' + (a + i) + '. Tente enviar de novo.');
    }
    await L.cmd([0x11, 1, 1]);
    $('pg').value = 100; log('Programa enviado e conferido! A placa já está rodando. ✔', 'ok');
  } finally {
    try { await L.r.cancel(); } catch {}
    await sleep(60); try { L.r.releaseLock(); L.w.releaseLock(); await port.close(); } catch {}
    setTimeout(() => { $('pg').hidden = true; }, 2500);
  }
}

// Botões
async function run(fn) {
  if (busy) return; busy = true; document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { if (e.name !== 'NotFoundError') log(e.message, 'err'); }
  busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false);
}
$('bCon').onclick = () => run(connect);
$('bClr').onclick = () => $('out').replaceChildren();
// Bibliotecas (busca em todo o índice da Arduino; o servidor instala ao compilar)
let PL = []; try { PL = JSON.parse(localStorage.getItem('om-libs') || '[]'); } catch {}
const savePL = () => { try { localStorage.setItem('om-libs', JSON.stringify(PL)); } catch {} };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
let kit = null, timer;
function chips() {
  $('dp').replaceChildren(...(PL.length ? [el('span', 'mu', 'Neste projeto:'), ...PL.map(n => {
    const b = el('button', 'g', n + ' ✕'); b.onclick = () => { PL = PL.filter(x => x !== n); savePL(); chips(); }; return b;
  })] : []));
}
function include(l) {
  const h = l.inc && l.inc[0];
  if (h) { const inc = '#include <' + h + '>'; if (!code.value.includes(inc)) { code.value = inc + '\n' + code.value; code.dispatchEvent(new Event('input')); } }
  if (!PL.includes(l.name)) { PL.push(l.name); savePL(); }
  log('Biblioteca adicionada: ' + l.name + (h ? ' (#include <' + h + '>)' : '')); chips();
}
function show(list, vazio, topo) {
  const rows = list.map(l => {
    const d = el('div', 'lc'); d.append(el('b', '', l.name), el('small', '', (l.author ? l.author + ' · ' : '') + (l.ver ? 'v' + l.ver : '')), el('p', '', l.text || ''));
    const b = el('button', 'main', 'Incluir'); b.onclick = () => include(l); d.append(b); return d;
  });
  $('dl').replaceChildren(...(topo ? [el('div', 'lc mu', topo)] : []), ...(rows.length ? rows : [el('div', 'lc', vazio)]));
}
async function libs() {
  const q = $('dq').value.trim(); chips();
  if (q.length < 2) {
    if (!kit) { try { kit = (await (await fetch('/api/libs')).json()).libs; } catch { kit = []; } }
    return show(kit, 'Não consegui carregar a lista do servidor.', 'Já instaladas no servidor. Digite acima para buscar em todas as bibliotecas da Arduino.');
  }
  $('dl').replaceChildren(el('div', 'lc', 'Buscando…'));
  try { const j = await (await fetch('/api/libs/search?q=' + encodeURIComponent(q))).json(); if ($('dq').value.trim() === q) show(j.libs, 'Nada encontrado.'); }
  catch { $('dl').replaceChildren(el('div', 'lc', 'Não consegui buscar. Tente de novo.')); }
}
$('bLib').onclick = () => { $('dlg').showModal(); libs(); };
$('dq').oninput = () => { clearTimeout(timer); timer = setTimeout(libs, 350); }; $('dX').onclick = () => $('dlg').close();

$('bVer').onclick = () => run(compile);
$('bUp').onclick = () => run(async () => {
  if ($('board').value !== 'arduino:avr:mega') throw new Error('O envio funciona só para o Mega 2560 nesta versão. Use Verificar.');
  if (!port) await connect();
  await upload(await compile());
});
log('Bem-vinda(o)! 1) Conectar USB  2) Verificar  3) Enviar para a placa');
</script>
</body>
</html>
